<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP Browser Tabs Bridge — Pairing</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        max-width: 560px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1f2329;
        line-height: 1.5;
      }
      h1 { font-size: 1.25rem; }
      label { display: block; font-weight: 600; margin: 1rem 0 0.25rem; }
      input {
        width: 100%;
        padding: 0.5rem;
        font: inherit;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        border: 1px solid #c9ced6;
        border-radius: 6px;
        box-sizing: border-box;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.55rem 1.1rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #1a73e8;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { background: #1666d0; }
      #status {
        margin-top: 1.25rem;
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        background: #f1f3f4;
        font-size: 0.9rem;
      }
      .dot { display: inline-block; width: 0.65rem; height: 0.65rem; border-radius: 50%; margin-right: 0.4rem; vertical-align: middle; background: #9aa0a6; }
      .connected { background: #1e8e3e; }
      .pending { background: #f9ab00; }
      .error { background: #d93025; }
      .hint { color: #5f6368; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <h1>MCP Browser Tabs Bridge</h1>
    <p class="hint">
      Paste the pairing token and port from the MCP server (ask the assistant to run
      <code>get_pairing_info</code>, or read <code>~/.config/mcp-browser-tabs/bridge.json</code>).
      This extension talks only to <code>127.0.0.1</code> and only manages tabs and tab groups.
    </p>

    <label for="token">Pairing token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="64-character hex token" />

    <label for="port">Port</label>
    <input id="port" type="number" min="1" max="65535" placeholder="37454" />

    <button id="save">Save &amp; connect</button>

    <div id="status"><span class="dot"></span><span id="status-text">Loading…</span></div>

    <script src="options.js"></script>
  </body>
</html>
